# dts/bindings/display/gc9a01.yaml
# Device Tree Binding for GC9A01 Round Display

description: GC9A01 240x240 round TFT display

compatible: "gc9a01"

include: ["spi-device.yaml"]

properties:
  width:
    type: int
    required: true
    description: Display width in pixels

  height:
    type: int
    required: true
    description: Display height in pixels

  dc-gpios:
    type: phandle-array
    required: true
    description: Data/Command GPIO pin

  reset-gpios:
    type: phandle-array
    required: false
    description: Reset GPIO pin (optional)

  rotation:
    type: int
    required: false
    default: 0
    enum: [0, 90, 180, 270]
    description: Display rotation in degrees