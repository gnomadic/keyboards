# boards/shields/lily58_round_display/lily58_round_display.conf
# Configuration for Lily58 dongle with round display

# Dongle configuration (same as lily58_dongle_xiao.conf)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Bluetooth settings for dongle
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Display configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# SPI and display drivers
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_GPIO=y

# LVGL configuration optimized for round display
CONFIG_LVGL=y
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_Z_DPI_DEF=148
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768  # Increased for 240x240 display

# Canvas and drawing support for custom widgets
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_LABEL=y

# Font support for round display
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y

# Power management
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Performance optimizations
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Disable power management for display stability
CONFIG_PM_DEVICE=n