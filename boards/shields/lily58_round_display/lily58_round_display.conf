# boards/shields/lily58_round_display/lily58_round_display.conf

# Dongle configuration
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Display configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_ROUND=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Hardware drivers
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_DISPLAY_GC9A01=y
CONFIG_GPIO=y

# LVGL for round display
CONFIG_LVGL=y
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Drawing support
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_LABEL=y

# Fonts
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y

# Power and performance
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5


#logging
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_DISPLAY_LOG_LEVEL_DBG=y


# Enable debug-level logs
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4   # 0=none, 1=err, 2=warn, 3=inf, 4=dbg

# Keep logs until flushed over USB
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# USB logging specific tuning
CONFIG_LOG_BACKEND_USB=y
CONFIG_LOG_BACKEND_USB_AUTOSTART=y
CONFIG_LOG_BACKEND_USB_OUTPUT_TEXT=y

# Bigger queue so early logs aren’t dropped
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_BACKEND_USB_BUFFER_SIZE=2048
