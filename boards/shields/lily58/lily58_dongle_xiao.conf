# MC:
# compatible con todas las versiones de nrf52840 (xiao):
# - seeeduino_xiao_ble (probado)

### DONGLE MODE
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

### DONGLE OPTIONS
# 3 profiles (n+2)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

### DISPLAY DONGLE OPTIONS
# CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

### POWER OPTIONS
# La unidad del intervalo del informe de energía de la batería es segundos
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

### DEBUG OPTIONS
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000


###
CONFIG_PM_DEVICE=n
CONFIG_PM=n

#  Essential display configs that should work
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_LVGL=y

# PWM for backlight
# CONFIG_PWM=n

# Comment out these potentially problematic ones:
# CONFIG_SPI_NRFX_SPIM=y          # Might be auto-enabled
# CONFIG_GC9A01=y                 # Driver might not exist in your version
# CONFIG_LV_Z_MEM_POOL_NUMBER_BLOCKS=8    # Config name might be different
# CONFIG_LV_Z_PARTIAL_REFRESH=y           # Config name might be different  
# CONFIG_LV_MEM_SIZE=32768                # Config name might be different

# These should be safe:
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_INFO=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# Logging for debugging
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y


