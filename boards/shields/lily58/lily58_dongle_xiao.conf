# MC:
# compatible con todas las versiones de nrf52840 (xiao):
# - seeeduino_xiao_ble (probado)

### DONGLE MODE
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

### DONGLE OPTIONS
# 3 profiles (n+2)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

### DISPLAY DONGLE OPTIONS
# CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

### POWER OPTIONS
# La unidad del intervalo del informe de energía de la batería es segundos
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

### DEBUG OPTIONS
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000



###


# dongle.conf - Configuration for ZMK dongle with display
# Add these configurations to your existing .conf file

# Display support
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Display driver
CONFIG_DISPLAY=y
CONFIG_GC9A01=y

# SPI support
CONFIG_SPI=y
# CONFIG_SPI_NRFX_SPIM=y

# Graphics support (LVGL)
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_INFO=y
CONFIG_LV_Z_MEM_POOL_NUMBER_BLOCKS=8
CONFIG_LV_Z_BITS_PER_PIXEL=16

# Font support for LVGL
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y

# PWM for backlight control
CONFIG_PWM=y
CONFIG_PWM_NRFX=y
CONFIG_LED_PWM=y

# Enable framebuffer for smooth updates
CONFIG_LV_Z_FULL_REFRESH=n
CONFIG_LV_Z_PARTIAL_REFRESH=y

# Memory optimization for circular display
CONFIG_LV_MEM_SIZE=32768

# Optional: Touch support (if your round display has touch)
# CONFIG_INPUT=y
# CONFIG_CST816S=y

# Logging for debugging (disable in production)
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
CONFIG_SPI_LOG_LEVEL_INF=y

# Power management tweaks for display
CONFIG_PM=y
CONFIG_PM_DEVICE=y


