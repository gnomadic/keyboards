# Enable the display subsystem
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y

# SPI support (required for the GC9A01)
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# GPIO support for backlight
CONFIG_GPIO=y

# Disable power management for the display to avoid issues
CONFIG_PM_DEVICE=n

CONFIG_LVGL_HOR_RES_MAX=240
CONFIG_LVGL_VER_RES_MAX=240