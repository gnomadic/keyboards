# Enable display driver framework
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y   # optional, for troubleshooting

# Enable the GC9A01 SPI display
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# Enable backlight GPIO
CONFIG_GPIO=y

# Enable frame buffer / LVGL support
CONFIG_LVGL=y
CONFIG_LVGL_DISPLAY_DEV_NAME="GC9A01"

# Memory tuning (GC9A01 is 240x240 RGB565 = ~112KB framebuffer!)
CONFIG_LVGL_HOR_RES_MAX=240
CONFIG_LVGL_VER_RES_MAX=240
CONFIG_LVGL_BITS_PER_PIXEL=16
CONFIG_LVGL_VDB_SIZE=32          # tweak if memory tight

# Optional: reduce LVGL features to save RAM/flash
CONFIG_LVGL_USE_LABEL=y
CONFIG_LVGL_USE_BTN=y
CONFIG_LVGL_USE_IMG=y
CONFIG_LVGL_USE_ARC=n
CONFIG_LVGL_USE_TABVIEW=n
CONFIG_LVGL_USE_CALENDAR=n
CONFIG_LVGL_USE_CHART=n

# Optional: enable ZMK display widgets
CONFIG_ZMK_DISPLAY=y
