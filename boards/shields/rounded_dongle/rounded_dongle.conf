# ZMK Round Display Dongle Configuration

# Enable display support
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Enable LVGL (required for custom display)
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=n
CONFIG_LV_MEM_CUSTOM=y
CONFIG_LV_MEM_SIZE=65536

# SPI and Display drivers (leveraging Zephyr support)
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_GC9A01=y

# GPIO for display control
CONFIG_GPIO=y

# Enable our custom round display status module
CONFIG_ROUND_DISPLAY_STATUS=y

# ZMK Split keyboard settings
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_BLE=y

# Power management
CONFIG_PM_DEVICE=y

# Logging (for debugging - disable in production)
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
CONFIG_LVGL_LOG_LEVEL_WARN=y

# Memory settings
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048