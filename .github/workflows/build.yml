name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      # Extra CMake args passed into the build
      extra-cmake-args: >
        -DZMK_EXTRA_MODULES="${{ github.workspace }}/modules;${{ github.workspace }}/modules/lib/gui/lvgl"
